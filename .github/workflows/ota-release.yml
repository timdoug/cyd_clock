name: Firmware release assets

on:
  push:
    tags:
      - "r*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to, for example r2026.06.15"
        required: true

permissions:
  contents: write

# Creating a release in the GitHub UI with a new r* tag fires both the tag
# push and the release-published triggers; serialize them so two runs don't
# race uploading the same assets.
concurrency:
  group: ota-release-${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        # Pinned to the v4 commit; no later step pushes via these creds, so
        # do not leave the token in .git/config for the rest of the job.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # esp-idf-ci-action is pinned to its v1 branch commit. The action builds
      # the image as "<esp_idf_docker_image>:<esp_idf_version>", so appending
      # "@sha256:..." to the version pins the espressif/idf image by digest
      # (a name:tag@digest reference is valid and docker pulls by digest).
      - name: Build esp32_2432s028 (default)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d  # v1
        with:
          esp_idf_version: v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
          target: esp32
          path: "."
          command: idf.py -B build -D CYD_BOARD=esp32_2432s028 build

      - name: Build esp32_2432s024
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d  # v1
        with:
          esp_idf_version: v6.0.2@sha256:0d8c9773d48a327233f9c1d7c654ff0bcf133ae24503ea2e97a57cfe02b8cb67
          target: esp32
          path: "."
          command: idf.py -B build_024 -D CYD_BOARD=esp32_2432s024 build

      - name: Verify version string is not "unknown"
        # version.cmake only warns when git lookup fails; refuse to ship a
        # build stamped "unknown" rather than publish an unidentifiable asset.
        run: |
          set -eu
          for dir in build build_024; do
            header="$(find "${dir}" -path '*/main/version.h' | head -n1)"
            if [ -z "${header}" ]; then
              echo "version.h not found under ${dir}" >&2
              exit 1
            fi
            if grep -q '"unknown"' "${header}"; then
              echo "Refusing to ship: VERSION_STRING is \"unknown\" (${header})" >&2
              exit 1
            fi
          done

      - name: Prepare release assets
        run: |
          set -eu
          # OTA assets are raw app images: esp_https_ota expects the ESP app
          # descriptor at byte 0. USB assets are merged full-flash images so a
          # first install/recovery can write one file at 0x0 instead of asking
          # users to supply bootloader/partition/otadata offsets by hand.
          test -s build/cyd_clock-esp32_2432s028.bin
          test -s build_024/cyd_clock-esp32_2432s024.bin
          test -s build/bootloader/bootloader.bin
          test -s build/partition_table/partition-table.bin
          test -s build/ota_data_initial.bin
          cp build/cyd_clock-esp32_2432s028.bin cyd_clock.bin
          cp build_024/cyd_clock-esp32_2432s024.bin cyd_clock-esp32_2432s024.bin

          python3 - <<'PY'
          from pathlib import Path

          COMMON = [
              (0x1000, Path("build/bootloader/bootloader.bin")),
              (0x8000, Path("build/partition_table/partition-table.bin")),
              (0xf000, Path("build/ota_data_initial.bin")),
          ]

          def merge(out, app):
              pieces = COMMON + [(0x20000, Path(app))]
              image = bytearray()
              for offset, path in pieces:
                  if len(image) > offset:
                      raise SystemExit(f"{path} overlaps previous segment")
                  image.extend(b"\xff" * (offset - len(image)))
                  image.extend(path.read_bytes())
              Path(out).write_bytes(image)

          merge("cyd_clock-full.bin", "build/cyd_clock-esp32_2432s028.bin")
          merge("cyd_clock-esp32_2432s024-full.bin",
                "build_024/cyd_clock-esp32_2432s024.bin")
          PY

          test -s cyd_clock-full.bin
          test -s cyd_clock-esp32_2432s024-full.bin

      - name: Resolve release tag
        id: release
        # Tag names reach the shell via env, not template substitution, so a
        # crafted tag cannot inject shell into a run with a write token.
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${TAG_INPUT}"
            # A hand-entered tag is untrusted: require the r* naming scheme and
            # that the tag already exists, so a dispatch can only re-upload to a
            # real release, never invent one.
            case "${tag}" in
              r*) ;;
              *) echo "Refusing tag '${tag}': must start with 'r'" >&2; exit 1 ;;
            esac
            if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Refusing tag '${tag}': no such tag in the repository" >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            tag="${TAG_RELEASE}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build changelog notes
        # Release body: the commit subjects added since the previous r* release
        # reachable from this tag's history. "${TAG}^" starts the search at the
        # parent so the current tag never matches itself; the first-ever release
        # has no predecessor and falls back to a plain line.
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          prev="$(git describe --tags --abbrev=0 --match 'r*' "${TAG}^" 2>/dev/null || true)"
          {
            echo "CYD Clock ${TAG}"
            echo
            echo "### Files"
            echo
            echo "- \`cyd_clock-full.bin\`: USB install/recovery image for the 2.8\" ESP32-2432S028 board."
            echo "- \`cyd_clock-esp32_2432s024-full.bin\`: USB install/recovery image for the 2.4\" ESP32-2432S024 board."
            echo "- \`cyd_clock.bin\`: OTA image used by the clock's updater for the 2.8\" board."
            echo "- \`cyd_clock-esp32_2432s024.bin\`: OTA image used by the clock's updater for the 2.4\" board."
            echo
            echo "For USB install or recovery, flash the matching \`*-full.bin\`"
            echo "file at address \`0x0\`:"
            echo
            echo "\`\`\`sh"
            echo "python3 -m esptool --chip esp32 -p /dev/cu.usbserial-XXXX -b 2000000 write-flash 0x0 cyd_clock-full.bin"
            echo "\`\`\`"
            echo
            echo "The non-full \`.bin\` files are for OTA updates from the device UI;"
            echo "most users should not flash them manually."
            echo
            if [ -n "${prev}" ]; then
              echo "### Changes since ${prev}"
              echo
              # GitHub autolinks a bare short SHA to its commit page, so the
              # trailing hash renders as a clickable link in the release body.
              git log --no-merges --pretty='- %s (%h)' "${prev}..${TAG}"
            else
              echo "Initial release."
            fi
          } > release-notes.md

      - name: Create draft release if needed
        # Create as a draft with no assets so a half-finished or failed run
        # never leaves a published (or "latest") release pointing at nothing.
        # An already-published release (release-published trigger) is left as is.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          gh release view "${TAG}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md --draft

      - name: Upload firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          gh release upload "${TAG}" \
            cyd_clock.bin \
            cyd_clock-esp32_2432s024.bin \
            cyd_clock-full.bin \
            cyd_clock-esp32_2432s024-full.bin \
            --clobber

      - name: Publish release
        # Assets are uploaded, so publish the draft. Only mark this release
        # "latest" when its tag is actually the newest r* tag, so re-running an
        # old tag cannot steal the "latest" pointer from a newer release.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          newest="$(git tag --list 'r*' --sort=-version:refname | head -n1)"
          if [ "${TAG}" = "${newest}" ]; then
            gh release edit "${TAG}" --draft=false --latest
          else
            gh release edit "${TAG}" --draft=false --latest=false
          fi
